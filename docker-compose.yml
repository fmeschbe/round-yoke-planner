services:
  planner:
    build:
      context: .
    image: "${ROUND_YOKE_IMAGE:-round-yoke-planner:local}"
    ports:
      - "${ROUND_YOKE_BIND_ADDRESS:-127.0.0.1}:${ROUND_YOKE_PORT:-8080}:8080"
    restart: unless-stopped
    user: "101:101"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 64m
    cpus: 0.25
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
